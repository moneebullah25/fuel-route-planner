[project]
name = "backend"
version = "0.1.0"
description = "Fuel-Optimal Route Planner Backend"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"

dependencies = [
    "django>=5.0,<6.0",
    "django-cors-headers>=4.3.0",
    "djangorestframework>=3.15.0",
    "psycopg[binary]>=3.2.0",
    "python-dotenv>=1.0.1",
    "requests>=2.31.0",
]

[dependency-groups]
# Build-time only: regenerates api/data/stations.json from the raw OPIS CSV.
# Not needed at runtime (the geocoded JSON is committed).
build = ["pgeocode>=0.5.0"]
